server.port=8081

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pelada_pro_local?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# JWT
security.jwt.issuer=pelada-pro
security.jwt.secret=PELADA_PRO_SECRET_2026
security.jwt.expiration-hours=168

# Allow bean overriding for simple config
spring.main.allow-bean-definition-overriding=true
